{% extends 'base.html' %}

{% block title %}Delete Job - FirstHope{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card" style="padding: var(--space-6);">
        <h2 style="margin-bottom: var(--space-2); color: var(--text-primary);">Delete this job?</h2>
        <p style="color: var(--text-secondary); margin-bottom: var(--space-6);">
            Are you sure you want to permanently delete <strong>{{ job.title }}</strong>? This action cannot be undone.
        </p>
        <form method="post" style="display: flex; gap: var(--space-3);">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, delete job</button>
            <a href="{% url 'my_jobs' %}" class="btn btn-outline">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
