{% extends 'base.html' %}

{% block title %}Delete Job - FirstHope{% endblock %}

{% block content %}
<div class="container">
    <h2>Delete this job?</h2>
    <p>Are you sure you want to delete <strong>{{ job.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#c0392b;">Yes, delete</button>
        <a href="{% url 'my_jobs' %}">Cancel</a>
    </form>
</div>
{% endblock %}
