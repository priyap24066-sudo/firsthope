{% extends 'base.html' %}

{% block title %}Apply - {{ job.title }}{% endblock %}

{% block content %}
<div class="container">
    <h2>Apply for {{ job.title }}</h2>
    <p><strong>{{ job.company_name }}</strong> · {{ job.location }}</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <p class="helptext">Allowed: PDF, DOC, DOCX. Maximum 2 MB.</p>
        <button type="submit" class="btn">Submit Application</button>
    </form>
    <p><a href="{% url 'job_detail' job.pk %}">Cancel</a></p>
</div>
{% endblock %}
