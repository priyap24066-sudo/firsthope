{% extends 'base.html' %}

{% block title %}Register - FirstHope{% endblock %}

{% block content %}
<div class="container">
    <h2>Create your account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
