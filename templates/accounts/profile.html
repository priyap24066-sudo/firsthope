{% extends 'base.html' %}

{% block title %}My Profile - FirstHope{% endblock %}

{% block content %}
<div class="container">
    <h2>My Profile</h2>
    <p>Logged in as <strong>{{ user.username }}</strong> ({{ user.role }})</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Profile</button>
    </form>
</div>
{% endblock %}
