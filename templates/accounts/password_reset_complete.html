{% extends 'base.html' %}

{% block title %}Password Reset Complete - FirstHope{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card" style="padding: var(--space-6); text-align: center;">
        <h2 style="margin-bottom: var(--space-2);">Password updated</h2>
        <p style="color: var(--text-secondary); font-size: var(--font-body); margin-bottom: var(--space-6);">
            Your password has been changed successfully. You can now sign in with your new credentials.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Sign in now</a>
    </div>
</div>
{% endblock %}
