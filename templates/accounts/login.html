{% extends 'base.html' %}

{% block title %}Login - FirstHope{% endblock %}

{% block content %}
<div class="container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Login</button>
    </form>
    <p>New here? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
