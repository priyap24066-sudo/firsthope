{% extends 'base.html' %}

{% block title %}Reset Link Sent - FirstHope{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card" style="padding: var(--space-6); text-align: center;">
        <h2 style="margin-bottom: var(--space-2);">Check your email</h2>
        <p style="color: var(--text-secondary); font-size: var(--font-body); margin-bottom: var(--space-6);">
            If an account exists with the email you entered, instructions to reset your password have been sent.
            Please check your inbox and spam folder.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline">Return to sign in</a>
    </div>
</div>
{% endblock %}
