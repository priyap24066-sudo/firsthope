{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FirstHope{% endblock %}</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <link rel="icon" type="image/png" href="{% static 'icons/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FirstHope">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8;
               min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; }
        nav { background: #1e3a5f; padding: 12px 24px; display: flex;
              justify-content: space-between; align-items: center; flex-wrap: wrap; }
        nav a, nav button { color: white; text-decoration: none; margin-left: 16px;
              background: none; border: none; font-size: 16px; cursor: pointer; }
        nav .brand { font-size: 22px; font-weight: bold; margin-left: 0; }
        nav .user { color: #cfe0f5; margin-left: 16px; }
        nav form { display: inline; }
        .menu-btn { display: none; font-size: 28px; margin-left: 0; }
