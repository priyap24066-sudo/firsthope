{% extends 'base.html' %}

{% block title %}Schedule Interview - FirstHope{% endblock %}

{% block content %}
<div class="container">
    <h2>Schedule Interview</h2>
    <p><strong>{{ application.candidate.username }}</strong> for
       <strong>{{ application.job.title }}</strong></p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Schedule</button>
    </form>
    <p><a href="{% url 'job_applicants' application.job.pk %}">Cancel</a></p>
</div>
{% endblock %}
